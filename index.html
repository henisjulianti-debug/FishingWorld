<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fishing World</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#70c9ef, #b5e9f7);
  color: #17364a;
  text-align: center;
}
header {
  background: #247da5;
  color: white;
  padding: 18px;
  font-size: 25px;
  font-weight: bold;
}
.panel {
  background: white;
  margin: 20px auto;
  padding: 20px;
  width: 90%;
  max-width: 420px;
  border-radius: 18px;
  box-shadow: 0 5px 15px #477b8a44;
}
input, button {
  padding: 13px;
  border: 0;
  border-radius: 10px;
  margin: 6px;
  font-size: 16px;
}
input { background: #edf6fa; width: 85%; }
button {
  background: #168bb9;
  color: white;
  font-weight: bold;
}
#lake {
  background: linear-gradient(#55c8ec, #0879b4);
  padding: 55px 10px;
  border-radius: 15px;
  color: white;
  font-size: 24px;
}
#message { min-height: 30px; }
</style>
</head>
<body>

<header>🎣 FISHING WORLD</header>

<div class="panel">
  <h3>Selamat datang, Angler!</h3>
  <input id="playerName" placeholder="Nama pemain">
  <button onclick="joinGame()">Masuk Game</button>

  <h3>💰 Koin: <span id="coins">100</span></h3>

  <div id="lake">
    🌊 DANAU FISHING 🌊
    <p>🐟 🐠 🐟</p>
  </div>

  <button onclick="catchFish()">🎣 PANCING IKAN</button>
  <p id="message">Siap memancing?</p>
  <p>Pemain online: <span id="online">0</span></p>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let coins = 100;

socket.on("init", data => {
  coins = data.players[data.id].coins;
  updateCoins();
  updateOnline(data.players);
});

function joinGame() {
  const name = document.getElementById("playerName").value.trim();
  if (name) socket.emit("setName", name);
  document.getElementById("message").textContent =
    "Selamat bermain, " + (name || "Angler") + "!";
}

function catchFish() {
  socket.emit("catchFish");
  document.getElementById("message").textContent = "🎣 Sedang memancing...";
}

socket.on("caught", data => {
  coins = data.coins;
  updateCoins();
  document.getElementById("message").textContent =
    "Kau mendapatkan " + data.fish.name +
    "! +" + data.fish.price + " koin 🎉";
});

socket.on("playerJoined", () => {
  socket.emit("requestPlayers");
});

socket.on("playerMoved", () => {});
socket.on("playerLeft", () => {});

function updateCoins() {
  document.getElementById("coins").textContent = coins;
}

function updateOnline(players) {
  document.getElementById("online").textContent =
    Object.keys(players).length;
}
</script>
</body>
</html>
